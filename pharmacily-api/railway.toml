[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

 [deploy]
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Single service: Dockerfile ENTRYPOINT ["/api"] runs the HTTP server and the
# in-process cron worker together. Split into a worker-only service only once
# a worker mode flag exists.