[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
# Web service - handles HTTP requests
startCommand = "/api"

[[services]]
name = "worker"
# Background worker - handles sync jobs
startCommand = "/api"
# Worker mode - only runs background jobs, no HTTP server
# This would need a flag to run in worker-only mode
# For now, we'll run both in the same service on Railway free tier
# In production, separate into different services