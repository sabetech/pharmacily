name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migration:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      # Validate migrations against a local stack only. `supabase db push`
      # targets the linked remote project and fails in CI with
      # "Cannot find project ref. Have you run supabase link?".
      # `db reset --local` replays every migration from scratch instead.
      - name: Replay Migrations
        run: supabase db reset --local
      - name: Lint Schema
        run: supabase db lint --local --schema public
      - name: Verify No Drift
        run: |
          diff_output=$(supabase db diff --local --schema public)
          if [ -n "$diff_output" ]; then
            echo "$diff_output"
            echo "Drift detected: local database differs from supabase/migrations."
            exit 1
          fi
          echo "No drift: migrations match the local database."
      - name: Stop Supabase
        if: always()
        run: supabase stop