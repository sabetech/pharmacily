name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'pharmacily-web/**'
  pull_request:
    branches: [main]
    paths:
      - 'pharmacily-web/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci
      - name: Run lint
        working-directory: ./pharmacily-web
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci
      - name: Run typecheck
        working-directory: ./pharmacily-web
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci
      - name: Run tests
        working-directory: ./pharmacily-web
        run: npm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci
      - name: Build
        working-directory: ./pharmacily-web
        run: npm run build