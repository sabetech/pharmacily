name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'pharmacily-web/**'
  pull_request:
    branches: [main]
    paths:
      - 'pharmacily-web/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci --include=optional
      # npm records only the darwin binding in the lockfile (npm/cli#4828),
      # so Linux CI must install the native binding explicitly.
      - name: Install oxlint Linux binding
        working-directory: ./pharmacily-web
        run: npm install --no-save --no-package-lock --include=optional @oxlint/binding-linux-x64-gnu@1.80.0
      - name: Run lint
        working-directory: ./pharmacily-web
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci --include=optional
      - name: Run typecheck
        working-directory: ./pharmacily-web
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./pharmacily-web
        run: npm ci --include=optional
      - name: Build
        working-directory: ./pharmacily-web
        run: npm run build